---
- name: Require database password
  ansible.builtin.assert:
    that:
      - sonar_db_password is defined
      - sonar_db_password | length >= 16
    fail_msg: "Provide sonar_db_password securely (Ansible Vault or Jenkins credential)."
  no_log: true

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Configure vm.max_map_count for SonarQube search
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: '524288'
    state: present
    reload: true

- name: Configure fs.file-max
  ansible.posix.sysctl:
    name: fs.file-max
    value: '131072'
    state: present
    reload: true

- name: Create deployment directory
  ansible.builtin.file:
    path: "{{ sonarqube_install_dir }}"
    state: directory
    mode: '0700'

- name: Render Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ sonarqube_install_dir }}/compose.yml"
    mode: '0600'
  no_log: true

- name: Verify Docker Compose v2 is available
  ansible.builtin.command: docker compose version
  changed_when: false

- name: Start SonarQube and PostgreSQL
  ansible.builtin.command:
    cmd: docker compose -f compose.yml up -d
    chdir: "{{ sonarqube_install_dir }}"
  changed_when: true
  no_log: true

- name: Wait for SonarQube HTTP endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1:9000/api/system/status
    return_content: true
    status_code: 200
  register: sonar_status
  until: sonar_status.json.status | default('') == 'UP'
  retries: 60
  delay: 10
