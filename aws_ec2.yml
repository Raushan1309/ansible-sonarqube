---
# Optional manual dynamic inventory. Jenkins uses Terraform outputs to build
# its own temporary inventory for both private EC2 instances.
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  instance-state-name: running
  tag:env: sonarqube
hostnames:
  - private-ip-address
compose:
  ansible_host: private_ip_address
groups:
  sonarqube_servers: "tags.role | default('') in ['sonarqube-active', 'sonarqube-passive']"
